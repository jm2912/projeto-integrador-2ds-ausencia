<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>abscene — Cadastro de Professor</title>
<link rel="stylesheet" href="sla.css">
</head>
<body>

  <div class="logo">abscene</div>

  <div class="cadastro">
    <h1>Cadastro de Professor</h1>
    <p class="subtitle">Preencha os dados para criar sua conta</p>

    <form id="form">
      <input type="email" id="email" placeholder="Email" required>
      <input type="text" id="nome" placeholder="Nome completo" required>
      <input type="text" id="cep" placeholder="CEP" required>
      <input type="text" id="cpf" placeholder="CPF" required>
      <input type="text" id="materia" placeholder="Matéria" required>
      <input type="password" id="senha" placeholder="Senha" required>
      <input type="password" id="confirmarSenha" placeholder="Confirmar senha" required>

      <select id="turno" required>
        <option value="" disabled selected>Turno</option>
        <option value="manha">Manhã</option>
        <option value="tarde">Tarde</option>
        <option value="noite">Noite</option>
      </select>

      <button type="submit">Cadastrar</button>
    </form>

    <p class="footer">Já possui uma conta? <a href="#">Entrar</a></p>
  </div>

<script src="sla.js"></script>
</body>
</html>
